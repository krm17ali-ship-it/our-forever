<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Forever ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f8f5f2;
            color: #333;
        }

        .home-page {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
        }

        .profile {
            background: white;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .profile img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            margin: 15px 0 8px;
        }

        .welcome {
            color: #777;
            margin-bottom: 25px;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        .stat {
            flex: 1;
            background: #f5f5f5;
            padding: 15px 5px;
            border-radius: 15px;
        }

        .stat strong {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .tasks-title {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        /* =========================
           XP LEAGUE
        ========================= */

        .league-box {
            background: #fff;
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .league-box h2 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }

        .league-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .league-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            margin-bottom: 10px;
            background: #f8f5f2;
            border-radius: 16px;
            transition: 0.2s;
        }

        .league-player:last-child {
            margin-bottom: 0;
        }

        .league-player.leader {
            background: #fff5c7;
        }

        .rank {
            width: 35px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        .player-info {
            flex: 1;
            text-align: right;
        }

        .player-name {
            display: block;
            font-size: 17px;
            font-weight: bold;
        }

        .player-status {
            display: block;
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        .player-xp {
            font-size: 18px;
            font-weight: bold;
            color: #e78ba5;
            white-space: nowrap;
        }

        .task {
            width: 100%;
            display: block;
            padding: 18px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            background: white;
            font-size: 17px;
            text-align: right;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .task:hover {
            transform: translateY(-1px);
            background: #fff5f7;
        }

        .task:disabled {
            cursor: default;
        }

        .task.done {
            opacity: 0.55;
            text-decoration: line-through;
            background: #eeeeee;
        }

        #statusMessage {
            min-height: 25px;
            margin: 15px 0;
            color: #777;
            font-size: 14px;
        }

        #logoutBtn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .progress-box {
            background: #fff;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
            text-align: right;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #555;
        }

        .progress-info strong {
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #e78ba5;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

    </style>

</head>

<body>

<div class="home-page">

    <div class="profile">

        <img
            src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=300&q=80"
            alt="Our Forever"
        >

        <h1>Karam &amp; Doaa ❤️</h1>

        <p class="welcome">
            أهلاً بيكم في مساحتنا الخاصة
        </p>

        <!-- =========================
             MY STATS
        ========================== -->

        <div class="stats">

            <div class="stat">

                <strong id="score">
                    0
                </strong>

                ⭐ XP

            </div>

            <div class="stat">

                <strong id="level">
                    1
                </strong>

                🏆 المستوى

            </div>

            <div class="stat">

                <strong id="streak">
                    0
                </strong>

                🔥 Streak

            </div>

        </div>


        <!-- =========================
             XP LEAGUE
        ========================== -->

        <div class="league-box">

            <h2>
                🏆 دوري الـ XP ❤️
            </h2>

            <div class="league-subtitle">
                مين فينا متصدر؟ 👀
            </div>

            <div id="leaguePlayers">

                <div class="league-player">

                    <div class="rank">
                        1
                    </div>

                    <div class="player-info">

                        <span class="player-name">
                            جاري التحميل...
                        </span>

                    </div>

                    <div class="player-xp">
                        0 XP
                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             DAILY TASKS
        ========================== -->

        <h2 class="tasks-title">
            مهام اليوم ❤️
        </h2>


        <!-- =========================
             DAILY PROGRESS
        ========================== -->

        <div class="progress-box">

            <div class="progress-info">

                <span>

        <button

        <button
            class="task"
            data-name="study"

        >
            ☐ 📚 مذاكرة
        </button>

        <button
            class="task"
            data-name="prayer"
            data-points="30"
        >
            ☐ 🕌 الصلاة
        </button>

        <button
            class="task"
            data-name="quran"
            data-points="10"
        >
            ☐ 📖 ورد قرآن
        </button>


        <p id="statusMessage"></p>


        <button id="logoutBtn">
            تسجيل الخروج
        </button>

    </div>

</div>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
        "https://rxyongbssvpqwijycrxl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_HeV2SjcdkjAwVquKcABC5w_FnOwF1SR";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // GLOBAL VARIABLES
    // ==========================================

    let currentUser = null;

    let isProcessingTask = false;


    // ==========================================
    // STATUS
    // ==========================================

    function showStatus(message) {

        document
            .getElementById("statusMessage")
            .textContent = message;
    }


    // ==========================================
    // GET CURRENT USER
    // ==========================================

    async function getCurrentUser() {

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if (error) {

            console.error(
                "GET USER ERROR:",
                error
            );

            return false;
        }

        if (!data || !data.user) {

            window.location.href =
                "index.html";

            return false;
        }

        currentUser =
            data.user;

        return true;
    }


    // ==========================================
    // GET TODAY
    // ==========================================

    function getToday() {

        const now =
            new Date();

        const year =
            now.getFullYear();

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                now.getDate()
            ).padStart(2, "0");

        return (
            year +
            "-" +
            month +
            "-" +
            day
        );
    }


    // ==========================================
    // GET YESTERDAY
    // ==========================================

    function getYesterday() {

        const date =
            new Date();

        date.setDate(
            date.getDate() - 1
        );

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return (
            year +
            "-" +
            month +
            "-" +
            day
        );
    }


    // ==========================================
    // CALCULATE LEVEL
    // ==========================================

    function calculateLevel(score) {

        if (score >= 350) {
            return 5;
        }

        if (score >= 200) {
            return 4;
        }

        if (score >= 100) {
            return 3;
        }

        if (score >= 50) {
            return 2;
        }

        return 1;
    }


    // ==========================================
    // SHOW MY STATS
    // ==========================================

    function showStats(
        score,
        level,
        streak
    ) {

        document
            .getElementById("score")
            .textContent = score;

        document
            .getElementById("level")
            .textContent = level;

        document
            .getElementById("streak")
            .textContent = streak;
    }


    // ==========================================
    // LOAD MY STATS
    // ==========================================

    async function loadUserStats() {

        const {
            data: stats,
            error
        } = await supabaseClient
            .from("user_stats")
            .select(
                "user_id, score, streak, level, last_completed_date"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();

        if (error) {

            console.error(
                "LOAD USER STATS ERROR:",
                error
            );

            showStatus(
                "حدث خطأ في تحميل الـ XP"
            );

            return false;
        }


        // ==================================
        // CREATE STATS IF NOT EXIST
        // ==================================

        if (!stats) {

            const {
                data: newStats,
                error: insertError
            } = await supabaseClient
                .from("user_stats")
                .insert({

                    user_id:
                        currentUser.id,

                    score:
                        0,

                    streak:
                        0,

                    level:
                        1,

                    last_completed_date:
                        null

                })
                .select()
                .single();

            if (insertError) {

                console.error(
                    "CREATE USER STATS ERROR:",
                    insertError
                );

                showStatus(
                    "حدث خطأ في إنشاء بيانات الحساب"
                );

                return false;
            }

            showStats(
                Number(newStats.score) || 0,
                Number(newStats.level) || 1,
                Number(newStats.streak) || 0
            );

            return true;
        }


        // ==================================
        // SHOW SAVED STATS
        // ==================================

        showStats(
            Number(stats.score) || 0,
            Number(stats.level) || 1,
            Number(stats.streak) || 0
        );

        return true;
    }


    // ==========================================
    // LOAD XP LEAGUE
    // ==========================================

    async function loadXPLeague() {

        const {
            data: stats,
            error: statsError
        } = await supabaseClient
            .from("user_stats")
            .select(
                "user_id, score, level"
            )
            .order(
                "score",
                {
                    ascending: false
                }
            );


        if (statsError) {

            console.error(
                "XP LEAGUE STATS ERROR:",
                statsError
            );

            showStatus(
                "حدث خطأ في تحميل دوري الـ XP"
            );

            return;
        }


        // ==========================================
        // LOAD PROFILES
        // ==========================================

        const {
            data: profiles,
            error: profilesError
        } = await supabaseClient
            .from("profiles")
            .select(
                "id, name"
            );


        if (profilesError) {

            console.error(
                "XP LEAGUE PROFILES ERROR:",
                profilesError
            );

            showStatus(
                "حدث خطأ في تحميل أسماء اللاعبين"
            );

            return;
        }


        // ==========================================
        // MATCH STATS WITH PROFILES
        // ==========================================

        const players =
            stats
                .map(
                    function(stat) {

                        const profile =
                            profiles.find(
                                function(profile) {

                                    return (
                                        profile.id ===
                                        stat.user_id
                                    );

                                }
                            );

                        if (!profile) {
                            return null;
                        }

                        return {

                            id:
                                stat.user_id,

                            name:
                                profile.name,

                            score:
                                Number(stat.score) || 0,

                            level:
                                Number(stat.level) || 1

                        };

                    }
                )
                .filter(
                    function(player) {

                        return player !== null;

                    }
                );


        // ==========================================
        // SORT BY XP
        // ==========================================

        players.sort(
            function(a, b) {

                return b.score - a.score;

            }
        );


        // ==========================================
        // SHOW LEAGUE
        // ==========================================

        const league =
            document.getElementById(
                "leaguePlayers"
            );

        league.innerHTML = "";


        if (players.length === 0) {

            league.innerHTML = `

                <div class="league-player">

                    <div class="player-info">

                        <span class="player-name">
                            لا توجد بيانات بعد ❤️
                        </span>

                    </div>

                </div>

            `;

            return;
        }


        players.forEach(
            function(player, index) {

                const isLeader =
                    index === 0;

                const isMe =
                    player.id ===
                    currentUser.id;


                let rankIcon =
                    index + 1;


                if (index === 0) {
                    rankIcon = "👑";
                }

                if (index === 1) {
                    rankIcon = "🥈";
                }


                const playerElement =
                    document.createElement(
                        "div"
                    );


                playerElement.className =
                    "league-player" +
                    (
                        isLeader
                            ? " leader"
                            : ""
                    );


                playerElement.innerHTML = `

                    <div class="rank">
                        ${rankIcon}
                    </div>

                    <div class="player-info">

                        <span class="player-name">

                            ${player.name}

                            ${
                                isMe
                                    ? " ⭐"
                                    : ""
                            }

                        </span>

                        <span class="player-status">

                            المستوى ${player.level}

                            ${
                                isLeader
                                    ? " • المتصدر 🔥"
                                    : ""
                            }

                        </span>

                    </div>

                    <div class="player-xp">

                        ${player.score} XP

                    </div>

                `;


                league.appendChild(
                    playerElement
                );

            }
        );
    }


    // ==========================================
    // LOAD TODAY TASKS
    // ==========================================

    async function loadTodayTasks() {

        const today =
            getToday();


        const {
            data: tasks,
            error
        } = await supabaseClient
            .from("daily_tasks")
            .select(
                "id, task_name, points, completed, task_date"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .eq(
                "task_date",
                today
            );


        if (error) {

            console.error(
                "LOAD TODAY TASKS ERROR:",
                error
            );

            showStatus(
                "حدث خطأ في تحميل مهام اليوم"
            );

            return false;
        }


        const buttons =
            document.querySelectorAll(
                ".task"
            );


        buttons.forEach(
            function(button) {

                const taskName =
                    button.dataset.name;


                const savedTask =
                    tasks.find(
                        function(task) {

                            return (
                                task.task_name ===
                                taskName
                            );

                        }
                    );


                if (
                    savedTask &&
                    savedTask.completed
                ) {

                    markButtonAsDone(
                        button
                    );

                }

            }
        );


        return true;
    }


    // ==========================================
    // MARK BUTTON DONE
    // ==========================================

    function markButtonAsDone(button) {

        if (
            button.classList.contains("done")
        ) {
            return;
        }


        const originalText =
            button.textContent
                .replace("☐", "")
                .replace("✅", "")
                .trim();


        button.classList.add(
            "done"
        );


        button.disabled = true;


        button.textContent =
            "✅ " +
            originalText;
    }


    // ==========================================
    // UPDATE STREAK
    // ==========================================

    async function updateStreak(stats) {

        const today =
            getToday();

        const yesterday =
            getYesterday();

        const lastDate =
            stats.last_completed_date;


        let newStreak =
            Number(stats.streak) || 0;


        if (
            lastDate === today
        ) {

            return newStreak;
        }


        if (
            lastDate === yesterday
        ) {

            newStreak =
                newStreak + 1;

        } else {

            newStreak = 1;
        }


        return newStreak;
    }


    // ==========================================
    // UPDATE DAILY PROGRESS
    // ==========================================

    function updateDailyProgress() {

        const buttons =
            document.querySelectorAll(
                ".task"
            );


        let completed = 0;


        buttons.forEach(
            function(button) {

                if (
                    button.classList.contains("done")
                ) {

                    completed++;
                }

            }
        );


        const total =
            buttons.length;


        const percentage =
            total === 0
                ? 0
                : Math.round(
                    (completed / total) * 100
                );


        document
            .getElementById("progressText")
            .textContent =
            completed +
            " / " +
            total;


        document
            .getElementById("progressFill")
            .style.width =
            percentage +
            "%";
    }


    // ==========================================
    // COMPLETE TASK
    // ==========================================

    async function completeTask(button) {

        if (!currentUser) {
            return;
        }


        if (
            button.classList.contains("done")
        ) {
            return;
        }


        if (isProcessingTask) {
            return;
        }


        isProcessingTask = true;


        showStatus(
            "جاري تسجيل المهمة..."
        );


        const taskName =
            button.dataset.name;


        const points =
            Number(
                button.dataset.points
            );


        const today =
            getToday();


        try {


            // ==================================
            // CHECK EXISTING TASK
            // ==================================

            const {
                data: existingTask,
                error: checkError
            } = await supabaseClient
                .from("daily_tasks")
                .select(
                    "id, task_name, points, completed, task_date"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .eq(
                    "task_name",
                    taskName
                )
                .eq(
                    "task_date",
                    today
                )
                .maybeSingle();


            if (checkError) {

                console.error(
                    "CHECK TASK ERROR:",
                    checkError
                );

                showStatus(
                    "حدث خطأ أثناء تسجيل المهمة"
                );

                return;
            }


            // ==================================
            // ALREADY COMPLETED
            // ==================================

            if (
                existingTask &&
                existingTask.completed
            ) {

                markButtonAsDone(
                    button
                );

                showStatus(
                    "المهمة مكتملة بالفعل ❤️"
                );

                return;
            }


            // ==================================
            // SAVE TASK
            // ==================================

            if (!existingTask) {

                const {
                    error: insertError
                } = await supabaseClient
                    .from("daily_tasks")
                    .insert(
                        {

                            user_id:
                                currentUser.id,

                            task_name:
                                taskName,

                            points:
                                points,

                            completed:
                                true,

                            task_date:
                                today

                        }
                    );


                if (insertError) {

                    console.error(
                        "INSERT TASK ERROR:",
                        insertError
                    );

                    showStatus(
                        "حدث خطأ أثناء حفظ المهمة"
                    );

                    return;
                }

            } else {

                const {
                    error: updateTaskError
                } = await supabaseClient
                    .from("daily_tasks")
                    .update(
                        {
                            completed:
                                true
                        }
                    )
                    .eq(
                        "id",
                        existingTask.id
                    );


                if (updateTaskError) {

                    console.error(
                        "UPDATE TASK ERROR:",
                        updateTaskError
                    );

                    showStatus(
                        "حدث خطأ أثناء تحديث المهمة"
                    );

                    return;
                }
            }


            // ==================================
            // GET CURRENT XP
            // ==================================

            const {
                data: stats,
                error: statsError
            } = await supabaseClient
                .from("user_stats")
                .select(
                    "score, streak, level, last_completed_date"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


            if (statsError) {

                console.error(
                    "GET STATS ERROR:",
                    statsError
                );

                showStatus(
                    "تم حفظ المهمة لكن حدث خطأ في الـ XP"
                );

                return;
            }


            // ==================================
            // CALCULATE NEW XP
            // ==================================

            const oldScore =
                Number(stats?.score) || 0;


            const newScore =
                oldScore + points;


            // ==================================
            // CALCULATE STREAK
            // ==================================

            const newStreak =
                await updateStreak(
                    stats || {
                        score: 0,
                        streak: 0,
                        level: 1,
                        last_completed_date: null
                    }
                );


            // ==================================
            // CALCULATE LEVEL
            // ==================================

            const newLevel =
                calculateLevel(
                    newScore
                );


            // ==================================
            // SAVE XP
            // ==================================

            const {
                error: updateStatsError
            } = await supabaseClient
                .from("user_stats")
                .update(
                    {

                        score:
                            newScore,

                        streak:
                            newStreak,

                        level:
                            newLevel,

                        last_completed_date:
                            today

                    }
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


            if (updateStatsError) {

                console.error(
                    "UPDATE STATS ERROR:",
                    updateStatsError
                );

                showStatus(
                    "تم حفظ المهمة لكن حدث خطأ في تحديث الـ XP"
                );

                return;
            }


            // ==================================
            // UPDATE MY STATS
            // ==================================

            showStats(
                newScore,
                newLevel,
                newStreak
            );


            // ==================================
            // MARK TASK DONE
            // ==================================

            markButtonAsDone(
                button
            );


            // ==================================
            // UPDATE PROGRESS
            // ==================================

            updateDailyProgress();


            // ==================================
            // RELOAD XP LEAGUE
            // ==================================

            await loadXPLeague();


            showStatus(
                "تم تسجيل المهمة ❤️ +" +
                points +
                " XP"
            );


        } catch (error) {

            console.error(
                "COMPLETE TASK ERROR:",
                error
            );

            showStatus(
                "حدث خطأ غير متوقع"
            );

        } finally {

            isProcessingTask =
                false;
        }
    }


    // ==========================================
    // SETUP TASKS
    // ==========================================

    function setupTasks() {

        const buttons =
            document.querySelectorAll(
                ".task"
            );


        buttons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        completeTask(
                            button
                        );

                    }
                );

            }
        );
    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

        await supabaseClient
            .auth
            .signOut();


        window.location.href =
            "index.html";
    }


    // ==========================================
    // START APP
    // ==========================================

    async function startApp() {

        showStatus(
            "جاري تحميل بياناتك..."
        );


        const loggedIn =
            await getCurrentUser();


        if (!loggedIn) {
            return;
        }


        const statsLoaded =
            await loadUserStats();


        if (!statsLoaded) {
            return;
        }


        await loadTodayTasks();


        updateDailyProgress();


        await loadXPLeague();


        setupTasks();


        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                logout
            );


        showStatus(
            "أهلاً بيك ❤️"
        );
    }


    // ==========================================
    // START
    // ==========================================

    startApp();

</script>

</body>
