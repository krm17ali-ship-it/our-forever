<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Forever ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f8f5f2;
            color: #333;
        }

        .home-page {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
        }

        .profile {
            background: white;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .profile img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            margin: 15px 0 8px;
        }

        .welcome {
            color: #777;
            margin-bottom: 25px;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        .stat {
            flex: 1;
            background: #f5f5f5;
            padding: 15px 5px;
            border-radius: 15px;
        }

        .stat strong {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .tasks-title {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .competition-box {
            background: #fff;
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .competition-box h2 {
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }

        .player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f5f2;
            border-radius: 14px;
        }

        .player:last-child {
            margin-bottom: 0;
        }

        .player strong {
            color: #e78ba5;
        }

        .task {
            width: 100%;
            display: block;
            padding: 18px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            background: white;
            font-size: 17px;
            text-align: right;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .task:hover {
            transform: translateY(-1px);
            background: #fff5f7;
        }

        .task:disabled {
            cursor: default;
        }

        .task.done {
            opacity: 0.55;
            text-decoration: line-through;
            background: #eeeeee;
        }

        #statusMessage {
            min-height: 25px;
            margin: 15px 0;
            color: #777;
            font-size: 14px;
        }

        #logoutBtn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .progress-box {
            background: #fff;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
            text-align: right;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #555;
        }

        .progress-info strong {
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #e78ba5;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

    </style>

</head>

<body>

<div class="home-page">

    <div class="profile">

        <img
            src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=300&q=80"
            alt="Our Forever"
        >

        <h1>Karam &amp; Doaa ❤️</h1>

        <p class="welcome">
            أهلاً بيكم في مساحتنا الخاصة
        </p>

        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <strong id="score">
                    0
                </strong>

                ⭐ XP

            </div>

            <div class="stat">

                <strong id="level">
                    1
                </strong>

                🏆 المستوى

            </div>

            <div class="stat">

                <strong id="streak">
                    0
                </strong>

                🔥 Streak

            </div>

        </div>

        <h2 class="tasks-title">
            مهام اليوم ❤️
        </h2>

        <!-- DAILY COMPETITION -->

        <div class="competition-box">

            <h2>
                🏆 منافسة اليوم ❤️
            </h2>

            <div class="player">

                <span id="player1Name">
                    كرم ❤️
                </span>

                <strong id="player1Score">
                    0 نقطة
                </strong>

            </div>

            <div class="player">

                <span id="player2Name">
                    دعاء ❤️
                </span>

                <strong id="player2Score">
                    0 نقطة
                </strong>

            </div>

        </div>

        <!-- DAILY PROGRESS -->

        <div class="progress-box">

            <div class="progress-info">

                <span>
                    تقدم اليوم
                </span>

                <strong id="progressText">
                    0 / 4
                </strong>

            </div>

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </div>

        <!-- TASKS -->

        <button
            class="task"

        >
            ☐ 🇬🇧 20 دقيقة إنجليزي
        </button>

        <button
            class="task"
            data-name="study"
            data-points="20"
        >
            ☐ 📚 مذاكرة
        </button>

        <button
            class="task"
            data-name="prayer"
            data-points="30"
        >
            ☐ 🕌 الصلاة
        </button>

        <button
            class="task"
            data-name="quran"
            data-points="10"
        >
            ☐ 📖 ورد قرآن
        </button>

        <p id="statusMessage"></p>

        <button id="logoutBtn">
            تسجيل الخروج
        </button>

    </div>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
        "https://rxyongbssvpqwijycrxl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_HeV2SjcdkjAwVquKcABC5w_FnOwF1SR";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // GLOBAL VARIABLES
    // ==========================================

    let currentUser = null;

    let isProcessingTask = false;


    // ==========================================
    // STATUS MESSAGE
    // ==========================================

    function showStatus(message) {

        document
            .getElementById("statusMessage")
            .textContent = message;
    }


    // ==========================================
    // GET CURRENT USER
    // ==========================================

    async function getCurrentUser() {

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if (error) {

            console.error(
                "Get User Error:",
                error
            );

            return false;
        }

        if (!data || !data.user) {

            window.location.href =
                "index.html";

            return false;
        }

        currentUser =
            data.user;

        return true;
    }


    // ==========================================
    // GET TODAY - LOCAL DATE
    // ==========================================

    function getToday() {

        const now =
            new Date();

        const year =
            now.getFullYear();

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                now.getDate()
            ).padStart(2, "0");

        return (
            year +
            "-" +
            month +
            "-" +
            day
        );
    }


    // ==========================================
    // GET YESTERDAY
    // ==========================================

    function getYesterday() {

        const date =
            new Date();

        date.setDate(
            date.getDate() - 1
        );

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return (
            year +
            "-" +
            month +
            "-" +
            day
        );
    }


    // ==========================================
    // CALCULATE LEVEL
    // ==========================================

    function calculateLevel(score) {

        if (score >= 350) {
            return 5;
        }

        if (score >= 200) {
            return 4;
        }

        if (score >= 100) {
            return 3;
        }

        if (score >= 50) {
            return 2;
        }

        return 1;
    }


    // ==========================================
    // UPDATE SCREEN STATS
    // ==========================================

    function showStats(
        score,
        level,
        streak
    ) {

        document
            .getElementById("score")
            .textContent = score;

        document
            .getElementById("level")
            .textContent = level;

        document
            .getElementById("streak")
            .textContent = streak;
    }


    // ==========================================
    // LOAD USER STATS
    // ==========================================

    async function loadUserStats() {

        const {
            data: stats,
            error
        } = await supabaseClient
            .from("user_stats")
            .select(
                "user_id, score, streak, level, last_completed_date"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();

        if (error) {

            console.error(
                "LOAD USER STATS ERROR:",
                error
            );

            showStatus(
                "حدث خطأ في تحميل النقاط"
            );

            return false;
        }

        if (!stats) {

            const {
                data: newStats,
                error: insertError
            } = await supabaseClient
                .from("user_stats")
                .insert({

                    user_id:
                        currentUser.id,

                    score: 0,

                    streak: 0,

                    level: 1,

                    last_completed_date:
                        null

                })
                .select()
                .single();

            if (insertError) {

                console.error(
                    "CREATE USER STATS ERROR:",
                    insertError
                );

                showStatus(
                    "حدث خطأ في إنشاء بيانات الحساب"
                );

                return false;
            }

            showStats(
                Number(newStats.score) || 0,
                Number(newStats.level) || 1,
                Number(newStats.streak) || 0
            );

            return true;
        }

        console.log(
            "Saved score:",
            stats.score
        );

        showStats(
            Number(stats.score) || 0,
            Number(stats.level) || 1,
            Number(stats.streak) || 0
        );

        return true;
    }


    // ==========================================
    // LOAD TODAY TASKS
    // ==========================================

    async function loadTodayTasks() {

        const today =
            getToday();

        const {
            data: tasks,
            error
        } = await supabaseClient
            .from("daily_tasks")
            .select(
                "id, task_name, points, completed, task_date"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .eq(
                "task_date",
                today
            );

        if (error) {

            console.error(
                "LOAD TODAY TASKS ERROR:",
                error
            );

            showStatus(
                "حدث خطأ في تحميل مهام اليوم"
            );

            return false;
        }

        const buttons =
            document.querySelectorAll(
                ".task"
            );

        buttons.forEach(
            function(button) {

                const taskName =
                    button.dataset.name;

                const savedTask =
                    tasks.find(
                        function(task) {

                            return (
                                task.task_name ===
                                taskName
                            );

                        }
                    );

                if (
                    savedTask &&
                    savedTask.completed
                ) {

                    markButtonAsDone(
                        button
                    );

                }

            }
        );

        return true;
    }


    // ==========================================
    // MARK BUTTON DONE
    // ==========================================

    function markButtonAsDone(button) {

        if (
            button.classList.contains("done")
        ) {
            return;
        }

        const originalText =
            button.textContent
                .replace("☐", "")
                .replace("✅", "")
                .trim();

        button.classList.add(
            "done"
        );

        button.disabled = true;

        button.textContent =
            "✅ " +
            originalText;
    }


    // ==========================================
    // UPDATE STREAK
    // ==========================================

    async function updateStreak(stats) {

        const today =
            getToday();

        const yesterday =
            getYesterday();

        const lastDate =
            stats.last_completed_date;

        let newStreak =
            Number(stats.streak) || 0;

        if (
            lastDate === today
        ) {

            return newStreak;
        }

        if (
            lastDate === yesterday
        ) {

            newStreak =
                newStreak + 1;

        } else {

            newStreak = 1;
        }

        return newStreak;
    }


    // ==========================================
    // UPDATE DAILY COMPETITION SCORE
    // ==========================================

    async function updateDailyCompetitionScore() {

        const today =
            getToday();

        const {
            data: tasks,
            error: tasksError
        } = await supabaseClient
            .from("daily_tasks")
            .select(
                "points, completed"
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .eq(
                "task_date",
                today
            );

        if (tasksError) {

            console.error(
                "DAILY SCORE TASKS ERROR:",
                tasksError
            );

            return false;
        }

        let dailyScore = 0;

        tasks.forEach(
            function(task) {

                if (task.completed) {

                    dailyScore +=
                        Number(task.points) || 0;
                }

            }
        );

        const {
            error: scoreError
        } = await supabaseClient
            .from("daily_scores")
            .upsert(
                {
                    user_id:
                        currentUser.id,

                    score:
                        dailyScore,

                    score_date:
                        today
                },
                {
                    onConflict:
                        "user_id,score_date"
                }
            );

        if (scoreError) {

            console.error(
                "DAILY SCORE SAVE ERROR:",
                scoreError
            );

            return false;
        }

        return true;
    }


    // ==========================================
    // LOAD DAILY COMPETITION
    // ==========================================

    async function loadDailyCompetition() {

        const today =
            getToday();

        const {
            data: scores,
            error: scoresError
        } = await supabaseClient
            .from("daily_scores")
            .select(
                "user_id, score"
            )
            .eq(
                "score_date",
                today
            );

        if (scoresError) {

            console.error(
                "COMPETITION ERROR:",
                scoresError
            );

            return;
        }

        const {
            data: profiles,
            error: profilesError
        } = await supabaseClient
            .from("profiles")
            .select(
                "id, name"
            );

        if (profilesError) {

            console.error(
                "PROFILES ERROR:",
                profilesError
            );

            return;
        }

        // القيم الافتراضية لليوم
        // ثم نستبدلها بالبيانات الموجودة

        let karamScore = 0;
        let doaaScore = 0;

        let karamName =
            "كرم ❤️";

        let doaaName =
            "دعاء ❤️";

        scores.forEach(
            function(item) {

                const profile =
                    profiles.find(
                        function(p) {

                            return (
                                p.id ===
                                item.user_id
                            );

                        }
                    );

                if (!profile) {
                    return;
                }

                if (
                    profile.name.includes("كرم")
                ) {

                    karamName =
                        profile.name;

                    karamScore =
                        Number(item.score) || 0;
                }

                if (
                    profile.name.includes("دعاء")
                ) {

                    doaaName =
                        profile.name;

                    doaaScore =
                        Number(item.score) || 0;
                }

            }
        );

        document
            .getElementById("player1Name")
            .textContent =
            karamName;

        document
            .getElementById("player1Score")
            .textContent =
            karamScore +
            " نقطة";

        document
            .getElementById("player2Name")
            .textContent =
            doaaName;

        document
            .getElementById("player2Score")
            .textContent =
            doaaScore +
            " نقطة";
    }


    // ==========================================
    // UPDATE DAILY PROGRESS
    // ==========================================

    function updateDailyProgress() {

        const buttons =
            document.querySelectorAll(
                ".task"
            );

        let completed = 0;

        buttons.forEach(
            function(button) {

                if (
                    button.classList.contains("done")
                ) {

                    completed++;
                }

            }
        );

        const total =
            buttons.length;

        const percentage =
            total === 0
                ? 0
                : Math.round(
                    (completed / total) * 100
                );

        document
            .getElementById("progressText")
            .textContent =
            completed +
            " / " +
            total;

        document
            .getElementById("progressFill")
            .style.width =
            percentage +
            "%";
    }


    // ==========================================
    // COMPLETE TASK
    // ==========================================

    async function completeTask(button) {

        if (!currentUser) {
            return;
        }

        if (
            button.classList.contains("done")
        ) {
            return;
        }

        if (isProcessingTask) {
            return;
        }

        isProcessingTask = true;

        showStatus(
            "جاري تسجيل المهمة..."
        );

        const taskName =
            button.dataset.name;

        const points =
            Number(
                button.dataset.points
            );

        const today =
            getToday();

        try {

            // ==================================
            // CHECK EXISTING TASK
            // ==================================

            const {
                data: existingTask,
                error: checkError
            } = await supabaseClient
                .from("daily_tasks")
                .select(
                    "id, task_name, points, completed, task_date"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .eq(
                    "task_name",
                    taskName
                )
                .eq(
                    "task_date",
                    today
                )
                .maybeSingle();

            if (checkError) {

                console.error(
                    "CHECK TASK ERROR:",
                    checkError
                );

                showStatus(
                    "حدث خطأ أثناء تسجيل المهمة"
                );

                return;
            }


            // ==================================
            // ALREADY COMPLETED
            // ==================================

            if (
                existingTask &&
                existingTask.completed
            ) {

                markButtonAsDone(
                    button
                );

                showStatus(
                    "المهمة مكتملة بالفعل ❤️"
                );

                return;
            }


            // ==================================
            // SAVE TASK
            // ==================================

            if (!existingTask) {

                const {
                    error: insertError
                } = await supabaseClient
                    .from("daily_tasks")
                    .insert(
                        {
                            user_id:
                                currentUser.id,

                            task_name:
                                taskName,

                            points:
                                points,

                            completed:
                                true,

                            task_date:
                                today
                        }
                    );

                if (insertError) {

                    console.error(
                        "INSERT TASK ERROR:",
                        insertError
                    );

                    showStatus(
                        "حدث خطأ أثناء حفظ المهمة"
                    );

                    return;
                }

            } else {

                const {
                    error: updateTaskError
                } = await supabaseClient
                    .from("daily_tasks")
                    .update(
                        {
                            completed:
                                true
                        }
                    )
                    .eq(
                        "id",
                        existingTask.id
                    );

                if (updateTaskError) {

                    console.error(
                        "UPDATE TASK ERROR:",
                        updateTaskError
                    );

                    showStatus(
                        "حدث خطأ أثناء تحديث المهمة"
                    );

                    return;
                }
            }


            // ==================================
            // GET CURRENT USER STATS
            // ==================================

            const {
                data: stats,
                error: statsError
            } = await supabaseClient
                .from("user_stats")
                .select(
                    "score, streak, level, last_completed_date"
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();

            if (statsError) {

                console.error(
                    "GET STATS ERROR:",
                    statsError
                );

                showStatus(
                    "تم حفظ المهمة لكن حدث خطأ في النقاط"
                );

                return;
            }


            // ==================================
            // CALCULATE NEW XP
            // ==================================

            const oldScore =
                Number(stats?.score) || 0;

            const newScore =
                oldScore + points;


            // ==================================
            // CALCULATE STREAK
            // ==================================

            const newStreak =
                await updateStreak(stats);


            // ==================================
            // CALCULATE LEVEL
            // ==================================

            const newLevel =
                calculateLevel(
                    newScore
                );


            // ==================================
            // SAVE USER STATS
            // ==================================

            const {
                error: updateStatsError
            } = await supabaseClient
                .from("user_stats")
                .update(
                    {
                        score:
                            newScore,

                        streak:
                            newStreak,

                        level:
                            newLevel,

                        last_completed_date:
                            today
                    }
                )
                .eq(
                    "user_id",
                    currentUser.id
                );

            if (updateStatsError) {

                console.error(
                    "UPDATE STATS ERROR:",
                    updateStatsError
                );

                showStatus(
                    "تم حفظ المهمة لكن حدث خطأ في تحديث النقاط"
                );

                return;
            }


            // ==================================
            // UPDATE SCREEN STATS
            // ==================================

            showStats(
                newScore,
                newLevel,
                newStreak
            );


            // ==================================
            // MARK TASK DONE
            // ==================================

            markButtonAsDone(
                button
            );


            // ==================================
            // UPDATE DAILY COMPETITION
            // ==================================

            await updateDailyCompetitionScore();


            // ==================================
            // UPDATE PROGRESS
            // ==================================

            updateDailyProgress();


            // ==================================
            // RELOAD COMPETITION
            // ==================================

            await loadDailyCompetition();


            showStatus(
                "تم تسجيل المهمة ❤️ +" +
                points +
                " XP"
            );

        } catch (error) {

            console.error(
                "COMPLETE TASK ERROR:",
                error
            );

            showStatus(
                "حدث خطأ غير متوقع"
            );

        } finally {

            isProcessingTask =
                false;
        }
    }


    // ==========================================
    // SETUP TASK BUTTONS
    // ==========================================

    function setupTasks() {

        const buttons =
            document.querySelectorAll(
                ".task"
            );

        buttons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        completeTask(
                            button
                        );

                    }
                );

            }
        );
    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

        await supabaseClient
            .auth
            .signOut();

        window.location.href =
            "index.html";
    }


    // ==========================================
    // START APPLICATION
    // ==========================================

    async function startApp() {

        showStatus(
            "جاري تحميل بياناتك..."
        );

        const loggedIn =
            await getCurrentUser();

        if (!loggedIn) {
            return;
        }

        const statsLoaded =
            await loadUserStats();

        if (!statsLoaded) {
            return;
        }

        await loadTodayTasks();

        updateDailyProgress();

        await loadDailyCompetition();

        setupTasks();

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                logout
            );

        showStatus(
            "أهلاً بيك ❤️"
        );
    }


    // ==========================================
    // START
    // ==========================================

    startApp();

</script>

</body>
